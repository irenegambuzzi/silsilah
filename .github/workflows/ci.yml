name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Di CI tidak ada daftar nama (hanya di komputer pemilik), jadi yang
      # diperiksa di sini: pola rahasia dan file terlarang di seluruh repo.
      - run: node scripts/cek-data-pribadi.mjs --semua
      - run: npm run lint
      - run: npm test
